[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dealkit"
version = "0.1.0"
description = "Evidence-based real-estate deal screening with a human gate – deterministic valuation engine, evidence schemas, market profiles and red-flag checklists."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Hayal Özkan" }]
keywords = ["real-estate", "valuation", "screening", "json-schema", "claude-skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "click>=8.1",
  "jsonschema>=4.18",
  "referencing>=0.30",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
dealkit = "dealkit.cli:main"

[project.urls]
Homepage = "https://github.com/malkreide/dealkit"
Issues = "https://github.com/malkreide/dealkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dealkit"]

[tool.hatch.build.targets.sdist]
include = ["src/dealkit", "schemas", "README.md", "README.de.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines are checklist texts and f-strings
